<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1080" viewBox="0 0 540 1080" fill="none">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="500" height="1040" rx="70" fill="#0f172a"/>
  <rect x="36" y="56" width="468" height="992" rx="50" fill="#f8fafc"/>

  <!-- notch -->
  <rect x="240" y="36" width="60" height="12" rx="6" fill="#0f172a" transform="translate(-30,0) translate(270,0)" />

  <!-- app header -->
  <g transform="translate(56,96)">
    <rect width="120" height="36" rx="8" fill="#2563eb"/>
    <rect x="372" width="36" height="36" rx="18" fill="#cbd5e1"/>
  </g>

  <!-- balance card -->
  <g transform="translate(56,150)">
    <rect width="420" height="90" rx="14" fill="url(#g)"/>
    <text x="20" y="38" font-family="Inter, Arial" font-size="18" fill="#fff" font-weight="700">Rp 2.560.000</text>
    <text x="20" y="62" font-family="Inter, Arial" font-size="12" fill="#ffffff99">Total Penjualan Hari Ini</text>
  </g>

  <!-- stats -->
  <g transform="translate(56,260)">
    <rect width="200" height="72" rx="10" fill="#ffffff" stroke="#f1f5f9"/>
    <rect x="220" width="200" height="72" rx="10" fill="#ffffff" stroke="#f1f5f9"/>
    <text x="20" y="40" font-family="Inter, Arial" font-size="16" fill="#0f172a" font-weight="700">120</text>
    <text x="240" y="40" font-family="Inter, Arial" font-size="16" fill="#0f172a" font-weight="700">48</text>
  </g>

  <!-- quick menu -->
  <g transform="translate(56,360)">
    <rect width="420" height="120" rx="14" fill="#fff" stroke="#f1f5f9"/>
    <text x="16" y="28" font-family="Inter, Arial" font-size="12" fill="#475569" font-weight="700">Menu Cepat</text>
    <g transform="translate(0,36)">
      <rect width="96" height="64" rx="8" fill="#eff6ff"/>
      <rect x="108" width="96" height="64" rx="8" fill="#f3e8ff"/>
      <rect x="216" width="96" height="64" rx="8" fill="#fef3c7"/>
      <rect x="324" width="96" height="64" rx="8" fill="#e0e7ff"/>
    </g>
  </g>

  <!-- bottom nav -->
  <g transform="translate(56,520)">
    <rect width="420" height="56" rx="12" fill="#fff" stroke="#e2e8f0"/>
    <text x="28" y="36" font-family="Inter, Arial" font-size="12" fill="#2563eb">Beranda</text>
    <text x="128" y="36" font-family="Inter, Arial" font-size="12" fill="#94a3b8">Transaksi</text>
    <text x="228" y="36" font-family="Inter, Arial" font-size="12" fill="#94a3b8">Produk</text>
    <text x="328" y="36" font-family="Inter, Arial" font-size="12" fill="#94a3b8">Laporan</text>
    <text x="428" y="36" font-family="Inter, Arial" font-size="12" fill="#94a3b8">Akun</text>
  </g>

</svg>
